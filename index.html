<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1a0e08">
<title>Mithai Box</title>
<meta name="description" content="Pack the mithai dabba! Fit barfi, peda and kaju katli pieces into the box and clear rows. A new Daily Box every day, same pieces for everyone.">
<meta property="og:title" content="Mithai Box 🍬 Can you beat my score?">
<meta property="og:description" content="Fit the mithai into the dabba and clear rows. New Daily Box every day, same pieces for everyone!">
<meta property="og:type" content="website">
<meta property="og:url" content="https://heeray1.github.io/mithai-box/">
<meta property="og:image" content="https://heeray1.github.io/mithai-box/assets/share.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="assets/icon.png">
<link rel="apple-touch-icon" href="assets/icon.png">
<style>
  :root { --surface: rgba(28, 17, 11, .88); --line: rgba(255, 236, 210, .10); --text: #fff7ec; --muted: #b9a693;
    --chip: rgba(255, 236, 210, .08); --primary: #fff4e0; --ink: #24130a; --gold1: #ffdf8a; --gold2: #f2a64a; --bg: #1a0e08; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); touch-action: none;
    font-family: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-user-select: none; user-select: none; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* in-game glass buttons (no backdrop-filter: they sit above the live canvas) */
  .top { position: fixed; top: max(12px, env(safe-area-inset-top)); left: 12px; display: flex; gap: 8px; z-index: 3; }
  .ib { width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,.18); background: rgba(20,10,5,.55);
    color: #fff; font: inherit; font-size: 19px; font-weight: 900; cursor: pointer; display: flex; align-items: center; justify-content: center;
    padding: 0; margin: 0; transition: transform .1s; }
  .ib:active { transform: scale(.94); }
  /* overlays + cards */
  .ov { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 16px; z-index: 5;
    background: rgba(12, 6, 3, .52); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .ov.on { display: flex; }
  #home { background: rgba(12, 6, 3, .28); }
  .card { width: min(360px, 100%); max-height: calc(100% - 8px); overflow: auto; background: var(--surface); color: var(--text);
    border: 1px solid var(--line); border-radius: 30px; padding: 24px 20px 18px; text-align: center;
    box-shadow: 0 30px 80px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.06); animation: cardIn .28s cubic-bezier(.2,.9,.3,1.2); }
  @keyframes cardIn { from { transform: translateY(14px) scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }
  .card h1 { margin: 0; font-size: 30px; font-weight: 900; letter-spacing: -.5px; line-height: 1.1; }
  .card p { margin: 8px 0 0; font-size: 15px; font-weight: 600; line-height: 1.4; color: var(--muted); }
  .brand { font-size: 34px; font-weight: 900; letter-spacing: -1px; line-height: 1.1; }
  .brand b { background: linear-gradient(90deg, var(--gold1), var(--gold2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .label { margin: 0 0 4px; font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .big { font-size: 84px; font-weight: 900; line-height: 1; margin-top: 8px; color: #fff; text-shadow: 0 0 34px rgba(242,166,74,.35); }
  .chips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 14px; }
  .chip { padding: 7px 12px; border-radius: 999px; background: var(--chip); color: #f3e6d6; font-weight: 800; font-size: 14px; }
  .chips.how { gap: 6px; margin-top: 16px; }
  .chips.how .chip { font-size: 12.5px; padding: 6px 10px; color: var(--muted); }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; margin-top: 18px; min-height: 54px; padding: 0 18px;
    border: 0; border-radius: 999px; font: inherit; font-size: 18px; font-weight: 900; cursor: pointer; color: var(--text); background: var(--chip);
    transition: transform .1s; }
  .btn:active { transform: scale(.97); }
  .btn.primary { background: var(--primary); color: var(--ink); box-shadow: 0 10px 28px rgba(255, 214, 150, .18); }
  .btn.ghost { min-height: 46px; margin-top: 10px; font-size: 16px; background: transparent; border: 1px solid rgba(255, 236, 210, .18); color: #f3e6d6; }
  .actions { display: flex; gap: 10px; }
  .actions .btn { flex: 1; }
  .textbtn { display: inline-block; margin-top: 12px; color: var(--muted); font-weight: 800; font-size: 14px; text-decoration: none; cursor: pointer;
    background: none; border: 0; font-family: inherit; padding: 6px 8px; }
  /* milestone gem: only on a new best */
  .gem { display: none; width: 74px; height: 74px; margin: 0 auto 14px; border-radius: 50%; position: relative;
    background: conic-gradient(from 200deg, var(--gold1), var(--gold2), #ff8a8a, #d2a8ff, #8fe3c3, var(--gold1));
    box-shadow: 0 0 70px rgba(255, 190, 90, .7); animation: gemSpin 9s linear infinite, gemPulse 1.6s ease-in-out infinite; }
  .gem::after { content: ""; position: absolute; inset: 9px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.95), rgba(255,255,255,.25) 35%, rgba(255,255,255,0) 60%); }
  .milestone .gem { display: block; }
  @keyframes gemSpin { to { transform: rotate(360deg); } }
  @keyframes gemPulse { 50% { filter: brightness(1.25); } }
  .newbest { display: none; margin-top: 8px; font-size: 13px; font-weight: 900; letter-spacing: .08em; color: var(--gold1); }
  .milestone .newbest { display: block; }
  /* start card */
  #hero { display: block; width: 150px; height: 150px; margin: 10px auto 2px; }
  .modes { margin-top: 16px; display: grid; gap: 10px; }
  .mode { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; min-height: 62px; padding: 10px 18px;
    border-radius: 20px; border: 1px solid var(--line); background: rgba(255, 236, 210, .05); color: var(--text); font: inherit;
    text-align: left; cursor: pointer; transition: transform .1s; }
  .mode:active { transform: scale(.98); }
  .mode b { display: block; font-size: 18px; font-weight: 900; }
  .mode small { display: block; margin-top: 2px; font-size: 12.5px; font-weight: 700; color: var(--muted); }
  .mode .go { font-size: 14px; opacity: .55; flex: none; }
  .mode.primary { background: var(--primary); color: var(--ink); border-color: transparent; box-shadow: 0 10px 28px rgba(255,214,150,.18); }
  .mode.primary small { color: #7a5a3e; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="top" id="top">
  <button class="ib" id="bhome" aria-label="Home">&#8962;</button>
  <button class="ib" id="bsnd" aria-label="Sound">&#9834;</button>
</div>

<div class="ov on" id="home"><div class="card">
  <div class="brand">Mithai <b>Box</b></div>
  <canvas id="hero" width="600" height="600" aria-label="A dabba packed with barfi and peda"></canvas>
  <p>Pack the dabba. Clear the rows.</p>
  <div class="modes">
    <button class="mode primary" id="pdaily"><span><b>Daily Box</b><small id="sdaily"></small></span><span class="go">&#9654;</span></button>
    <button class="mode" id="pendless"><span><b>Endless</b><small id="sendless"></small></span><span class="go">&#9654;</span></button>
  </div>
  <div class="chips how"><span class="chip">Drag pieces in</span><span class="chip">Fill a row or column</span><span class="chip">Streaks score more</span></div>
</div></div>

<div class="ov" id="over"><div class="card">
  <div class="gem" aria-hidden="true"></div>
  <div class="label" id="fmode">Endless</div>
  <h1>Dabba full!</h1>
  <div class="big" id="fs">0</div>
  <div class="newbest" id="fnew">NEW BEST</div>
  <div class="chips"><span class="chip" id="fb">Best 0</span><span class="chip" id="fm">0 moves</span></div>
  <button class="btn primary" id="again">Play again</button>
  <div class="actions"><button class="btn ghost" id="share">Share</button><button class="btn ghost" id="tohome">Home</button></div>
</div></div>
<script>
"use strict";
const N = 8;
const cv = document.getElementById("c"), ctx0 = cv.getContext("2d"); let ctx = ctx0;
const Q = new URLSearchParams(location.search), BOT = Q.has("bot"), ART = Q.get("art");
const $ = id => document.getElementById(id);
const LS = { get(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } },
             set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }, del(k){ try{ localStorage.removeItem(k); }catch(e){} } };

// ---------- mithai flavours ----------
const FLAV = [
  { name:"Kaju katli",  a:"#f4ead6", b:"#d9c9a8", top:"varq"  },
  { name:"Rose barfi",  a:"#f8a8c4", b:"#e0709a", top:"pista" },
  { name:"Besan barfi", a:"#f5c658", b:"#d99a22", top:"almond"},
  { name:"Choco barfi", a:"#8a5636", b:"#5c3620", top:"almond"},
  { name:"Pista barfi", a:"#b7d98a", b:"#86b257", top:"pista" },
  { name:"Kesar peda",  a:"#ffa94d", b:"#e67a17", top:"kesar" },
];

// ---------- shapes ----------
function norm(cells){ const mx=Math.min(...cells.map(c=>c[0])), my=Math.min(...cells.map(c=>c[1]));
  return cells.map(c=>[c[0]-mx,c[1]-my]).sort((p,q)=>p[1]-q[1]||p[0]-q[0]); }
function rots(cells){ const out=[], seen=new Set(); let c=cells;
  for(let i=0;i<4;i++){ c=norm(c.map(([x,y])=>[-y,x])); const k=JSON.stringify(c); if(!seen.has(k)){seen.add(k);out.push(c);} }
  return out; }
const BASES = [
  { w:6, c:[[0,0]] },
  { w:8, c:[[0,0],[1,0]] },
  { w:8, c:[[0,0],[1,0],[2,0]] },
  { w:5, c:[[0,0],[1,0],[2,0],[3,0]] },
  { w:3, c:[[0,0],[1,0],[2,0],[3,0],[4,0]] },
  { w:8, c:[[0,0],[1,0],[0,1],[1,1]] },
  { w:3, c:[[0,0],[1,0],[2,0],[0,1],[1,1],[2,1],[0,2],[1,2],[2,2]] },
  { w:8, c:[[0,0],[0,1],[1,1]] },
  { w:5, c:[[0,0],[0,1],[0,2],[1,2],[2,2]] },
  { w:6, c:[[0,0],[1,0],[2,0],[1,1]] },
  { w:5, c:[[0,0],[1,0],[1,1],[2,1]] },
  { w:5, c:[[1,0],[2,0],[0,1],[1,1]] },
  { w:5, c:[[0,0],[0,1],[0,2],[1,2]] },
  { w:5, c:[[1,0],[1,1],[1,2],[0,2]] },
  { w:3, c:[[0,0],[1,0],[2,0],[0,1],[1,1],[2,1]] },
];
const SHAPES = [];
for(const b of BASES){ const r=rots(b.c); for(const c of r) SHAPES.push({ c, w:b.w/r.length, n:c.length }); }

// ---------- seeded random ----------
function mulberry(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function todayKey(){ const d=new Date(); return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate(); }
function niceDate(k){ return (k%100)+" "+["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][((k/100|0)%100)-1]; }

// difficulty: 0 at the start, 1 from 1500 points. Small pieces get rarer, big ones more common.
function level(){ return Math.min(1, score/1500); }
function pickShape(rng){
  const lv=level(); let sum=0; const ws=SHAPES.map(s=>{ const f = s.n<=3 ? 1.5-0.8*lv : s.n>=5 ? 0.45+0.95*lv : 1; sum+=s.w*f; return s.w*f; });
  let r=rng()*sum; for(let i=0;i<SHAPES.length;i++){ r-=ws[i]; if(r<=0) return SHAPES[i]; } return SHAPES[0];
}
function mkPiece(cells,f){ return { cells, f, w:Math.max(...cells.map(c=>c[0]))+1, h:Math.max(...cells.map(c=>c[1]))+1 }; }
function newPiece(rng){ const s=pickShape(rng); return mkPiece(s.c,(rng()*FLAV.length)|0); }

// ---------- state ----------
let mode="endless", seed=0, dayKey=0, deal=0, moves=0, startBest=0;
let grid, tray, score=0, shown=0, best=0, streak=0, over=true, drag=null, fx=[], pops=[], shake=0, playing=false;
const bestKey = () => mode==="daily" ? "mb_daily_"+dayKey : "mb_best";
const saveKey = m => "mb_save_"+m;

function canPlace(p,gx,gy){
  for(const [x,y] of p.cells){ const X=gx+x, Y=gy+y; if(X<0||Y<0||X>=N||Y>=N||grid[Y][X]>=0) return false; }
  return true;
}
function fitsAnywhere(p){ for(let y=0;y<=N-p.h;y++) for(let x=0;x<=N-p.w;x++) if(canPlace(p,x,y)) return true; return false; }
function refill(){
  // Deal number `deal` always starts from the same random stream, so the Daily Box gives everyone the same pieces.
  // It only re-rolls when a piece cannot fit the player's board (falls back to "at least one fits" on a crowded board).
  let ok=null;
  for(let t=0;t<60;t++){
    const rng=mulberry((seed ^ Math.imul(deal+1,2654435761) ^ Math.imul(t,40503))|0);
    const tr=[newPiece(rng),newPiece(rng),newPiece(rng)];
    if(tr.every(fitsAnywhere)){ ok=tr; break; }
    if(!ok&&tr.some(fitsAnywhere)) ok=tr;
    if(t===59&&!ok) ok=tr;
  }
  tray=ok; deal++;
}
function linesIfPlaced(p,gx,gy){
  const rows=[], cols=[]; const has=(X,Y)=>grid[Y][X]>=0||p.cells.some(([x,y])=>gx+x===X&&gy+y===Y);
  for(let y=0;y<N;y++){ let f=true; for(let x=0;x<N;x++) if(!has(x,y)){f=false;break;} if(f) rows.push(y); }
  for(let x=0;x<N;x++){ let f=true; for(let y=0;y<N;y++) if(!has(x,y)){f=false;break;} if(f) cols.push(x); }
  return { rows, cols };
}
function place(i,gx,gy){
  const p=tray[i]; const L=linesIfPlaced(p,gx,gy), now=performance.now();
  for(const [x,y] of p.cells) grid[gy+y][gx+x]=p.f;
  let gain=p.cells.length; const n=L.rows.length+L.cols.length; moves++;
  if(n){
    streak++; gain += 10*n*n + (streak>1 ? 10*(streak-1) : 0);
    const done=new Set();
    const zap=(x,y)=>{ const k=x+","+y; if(done.has(k)) return; done.add(k); fx.push({x,y,f:grid[y][x],t:now+(x+y)*12}); grid[y][x]=-1; };
    for(const y of L.rows) for(let x=0;x<N;x++) zap(x,y);
    for(const x of L.cols) for(let y=0;y<N;y++) zap(x,y);
    let word = n>=3 ? "Wah wah!" : n===2 ? "Double!" : streak>1 ? "Streak x"+streak : "Clear!";
    if(grid.every(r=>r.every(v=>v<0))){ gain+=100; word="Dabba saaf!"; }
    pops.push({ text:word+"  +"+gain, x:gx+p.w/2, y:gy+p.h/2, t:now });
    snd("clear", Math.min(6, n+Math.min(streak-1,3))); shake = n>=2 ? 1 : .5;
    if(navigator.vibrate&&!BOT) navigator.vibrate(n>=2?[20,30,40]:25);
  } else { streak=0; snd("place", p.cells.length); }
  score+=gain; tray[i]=null;
  if(tray.every(t=>!t)) refill();
  if(score>best){ best=score; LS.set(bestKey(),best); }
  if(!tray.some(t=>t&&fitsAnywhere(t))) endGame(); else save();
}
function save(){
  LS.set(saveKey(mode), JSON.stringify({ seed, dayKey, deal, moves, score, streak, startBest, grid, tray:tray.map(p=>p&&{c:p.cells,f:p.f}) }));
}
function start(m, fresh){
  mode=m; dayKey=todayKey(); grid=null;
  let s=null; if(!fresh){ try{ s=JSON.parse(LS.get(saveKey(m),"null")); }catch(e){} }
  if(s && (m!=="daily"||s.dayKey===dayKey) && Array.isArray(s.grid) && s.grid.length===N){
    ({ seed, deal, moves, score, streak, startBest } = s); grid=s.grid; tray=s.tray.map(p=>p&&mkPiece(p.c,p.f));
  }
  best=+LS.get(bestKey(),0);
  if(!grid){
    seed = m==="daily" ? dayKey : (Math.random()*2**31)|0;
    grid=Array.from({length:N},()=>Array(N).fill(-1)); score=0; streak=0; deal=0; moves=0; startBest=best; refill();
  }
  shown=score; over=false; drag=null; fx=[]; pops=[]; playing=true;
  $("home").classList.remove("on"); $("over").classList.remove("on"); $("top").style.display="flex";
}
function endGame(){
  over=true; LS.del(saveKey(mode)); snd("over");
  setTimeout(()=>{ if(!over) return;
    $("fs").textContent=score; $("fmode").textContent = mode==="daily" ? "Daily Box · "+niceDate(dayKey) : "Endless";
    $("fb").textContent=(mode==="daily"?"Today's best ":"Best ")+best; $("fm").textContent=moves+(moves===1?" move":" moves");
    $("over").classList.toggle("milestone", score>startBest && score>0);
    $("over").classList.add("on"); }, 700);
}
function goHome(){
  playing=false; drag=null; $("over").classList.remove("on"); $("top").style.display="none";
  const k=todayKey(), has=m=>{ try{ const s=JSON.parse(LS.get(saveKey(m),"null")); return s&&(m!=="daily"||s.dayKey===k)?s:null; }catch(e){ return null; } };
  const d=has("daily"), e=has("endless");
  $("sdaily").textContent = niceDate(k)+" · same for everyone · "+(d ? "continue at "+d.score : "best "+LS.get("mb_daily_"+k,0));
  $("sendless").textContent = (e ? "Continue at "+e.score : "No time limit")+" · best "+LS.get("mb_best",0);
  $("home").classList.add("on"); drawHero();
}

// ---------- sound ----------
let ac=null, muted=LS.get("mb_mute","0")==="1";
function snd(kind,n=1){
  if(BOT||muted) return;
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==="suspended") ac.resume();
    const t=ac.currentTime;
    const tone=(f,d,at,type="sine",v=.16)=>{ const o=ac.createOscillator(), g=ac.createGain();
      o.type=type; o.frequency.setValueAtTime(f,t+at); g.gain.setValueAtTime(.0001,t+at); g.gain.exponentialRampToValueAtTime(v,t+at+.008);
      g.gain.exponentialRampToValueAtTime(.001,t+at+d); o.connect(g).connect(ac.destination); o.start(t+at); o.stop(t+at+d+.02); };
    if(kind==="pick") tone(560,.05,0,"triangle",.07);
    if(kind==="place"){ const f=210-n*8; tone(f,.1,0,"triangle",.2); tone(f*.66,.09,.015,"sine",.14); }
    if(kind==="bad"){ tone(150,.1,0,"triangle",.09); tone(120,.12,.07,"triangle",.08); }
    if(kind==="clear"){ const sc=[523,659,784,1047,1319,1568,2093]; for(let i=0;i<=n;i++) tone(sc[i],.16+(i===n?.16:0),i*.065,"sine",.15); tone(196,.12,0,"triangle",.14); }
    if(kind==="over"){ tone(392,.2,0,"triangle"); tone(311,.2,.18,"triangle"); tone(233,.5,.36,"triangle"); }
  }catch(e){}
}

// ---------- layout ----------
let W,H,D,cell,ox,oy,trayY,trayH,slotW,mini,hk=1,bpad=12,hudRow=34;
function layout(){
  D=Math.min(window.devicePixelRatio||1,2.5); W=innerWidth; H=innerHeight;
  cv.width=W*D; cv.height=H*D;
  const top=Math.max(104, H*0.14);
  cell=Math.floor(Math.min((W-36)/N, (H-top-178)/N, 62));
  ox=Math.round((W-cell*N)/2); oy=Math.round(top);
  trayY=oy+cell*N+34; trayH=Math.max(cell*2.2, Math.min(H-trayY-12, cell*3.2));
  slotW=Math.min(W/3, cell*3.4); mini=Math.min(cell*0.52, slotW/5.6, trayH/5.4);
  // presentation only: HUD / card scale for tablets + laptops (like Chai Tower), box frame width, baked backdrop
  mini=Math.min(cell*.6, (slotW-14)/5, (trayH-24)/3.6);       // tray preview size (drawing only; slots are picked by slotW)
  hk=Math.max(1, Math.min(1.4, cell/44, oy/104)); bpad=Math.max(8, Math.min(14, cell*.26, ox-6));
  $("top").style.zoom=hk;
  let t0=12; try{ t0=Math.max(12,parseFloat(getComputedStyle($("top")).top)||12); }catch(e){}
  hudRow=(t0+22)*hk;                                   // centre line of the glass buttons (zoom scales their offset too)
  const k=Math.max(1, Math.min(W/400, H/700, 1.6));
  for(const el of document.querySelectorAll(".card")) el.style.zoom=Math.min(k, (H-24)/640);
  bakeBg();
}
function slotCenter(i){ return [W/2+(i-1)*slotW, trayY+trayH/2]; }

// ---------- drawing ----------
function rr(x,y,w,h,r){ ctx.beginPath(); ctx.roundRect(x,y,w,h,r); }

// backdrop: the Diwali table picture, dimmed once into an offscreen canvas, then baked full-screen (cover) with dark fades per resize
const BG="#1a0e08";
let bdImg=null, bdDim=null, bgC=null;
if(!ART){ bdImg=new Image(); bdImg.onload=()=>{ bakeBg(); }; bdImg.src="assets/backdrop.jpg"; }
function bakeBg(){
  if(bdImg&&bdImg.complete&&bdImg.naturalWidth&&!bdDim){
    const c=document.createElement("canvas"); c.width=bdImg.naturalWidth; c.height=bdImg.naturalHeight; const g=c.getContext("2d");
    g.drawImage(bdImg,0,0); g.fillStyle="rgba(26,13,7,.45)"; g.fillRect(0,0,c.width,c.height); bdDim=c;
  }
  if(!W) return;
  const c=bgC||document.createElement("canvas"); c.width=Math.round(W*D); c.height=Math.round(H*D); bgC=c;
  const g=c.getContext("2d"); g.setTransform(D,0,0,D,0,0);
  g.fillStyle=BG; g.fillRect(0,0,W,H);
  if(bdDim){
    const s=Math.max(W/bdDim.width, H/bdDim.height), dw=bdDim.width*s, dh=bdDim.height*s;
    g.drawImage(bdDim,(W-dw)/2,(H-dh)/2,dw,dh);
    const t=g.createLinearGradient(0,0,0,H);                         // fade into the solid colour behind the HUD and the tray
    t.addColorStop(0,"rgba(26,14,8,.92)"); t.addColorStop(Math.min(.3,(oy+20)/H),"rgba(26,14,8,.35)");
    t.addColorStop(.6,"rgba(26,14,8,.22)"); t.addColorStop(.85,"rgba(26,14,8,.6)"); t.addColorStop(1,"rgba(26,14,8,.92)");
    g.fillStyle=t; g.fillRect(0,0,W,H);
    const v=g.createRadialGradient(W/2,H/2,Math.min(W,H)*.3,W/2,H/2,Math.max(W,H)*.75);
    v.addColorStop(0,"rgba(0,0,0,0)"); v.addColorStop(1,"rgba(0,0,0,.45)"); g.fillStyle=v; g.fillRect(0,0,W,H);
  } else {
    const v=g.createRadialGradient(W/2,H*.45,0,W/2,H*.45,Math.max(W,H)*.7);
    v.addColorStop(0,"#3a2012"); v.addColorStop(1,BG); g.fillStyle=v; g.fillRect(0,0,W,H);
  }
}
function drawSweet(x,y,s,f,alpha=1){
  const F=FLAV[f], p=s*0.06, w=s-p*2;
  ctx.save(); ctx.globalAlpha*=alpha;
  ctx.fillStyle="rgba(40,10,10,.28)"; rr(x+p,y+p+s*.05,w,w,s*.2); ctx.fill();
  const g=ctx.createLinearGradient(x,y,x,y+s); g.addColorStop(0,F.a); g.addColorStop(1,F.b);
  ctx.fillStyle=g; rr(x+p,y+p,w,w,s*.2); ctx.fill();
  ctx.fillStyle="rgba(255,255,255,.32)"; rr(x+p+w*.1,y+p+w*.08,w*.8,w*.26,s*.12); ctx.fill();
  const cx=x+s/2, cy=y+s*.56;
  if(F.top==="pista"){ ctx.fillStyle="#4f8a2b";
    for(const [dx,dy,a] of [[-.14,-.02,.5],[.12,.06,-.6],[0,.14,1.4]]){ ctx.beginPath(); ctx.ellipse(cx+dx*s,cy+dy*s,s*.075,s*.035,a,0,7); ctx.fill(); } }
  if(F.top==="almond"){ ctx.fillStyle="#f3dcb4"; ctx.beginPath(); ctx.ellipse(cx,cy,s*.15,s*.085,-.5,0,7); ctx.fill();
    ctx.strokeStyle="rgba(120,70,30,.5)"; ctx.lineWidth=Math.max(1,s*.02); ctx.stroke(); }
  if(F.top==="varq"){ ctx.fillStyle="rgba(255,255,255,.9)"; ctx.beginPath();
    ctx.moveTo(cx,cy-s*.17); ctx.lineTo(cx+s*.2,cy); ctx.lineTo(cx,cy+s*.17); ctx.lineTo(cx-s*.2,cy); ctx.closePath(); ctx.fill();
    ctx.fillStyle="rgba(176,186,198,.8)"; ctx.beginPath(); ctx.moveTo(cx,cy-s*.17); ctx.lineTo(cx+s*.2,cy); ctx.lineTo(cx,cy); ctx.closePath(); ctx.fill(); }
  if(F.top==="kesar"){ ctx.strokeStyle="#b3260f"; ctx.lineWidth=Math.max(1.2,s*.035); ctx.lineCap="round";
    for(const [a,b,c,d] of [[-.14,-.04,.02,.04],[.0,-.08,.14,.02],[-.06,.1,.1,.12]]){ ctx.beginPath(); ctx.moveTo(cx+a*s,cy+b*s); ctx.lineTo(cx+c*s,cy+d*s); ctx.stroke(); } }
  ctx.restore();
}
function drawPiece(p,x,y,s,alpha=1){ for(const [cx,cy] of p.cells) drawSweet(x+cx*s,y+cy*s,s,p.f,alpha); }
function drawBox(x,y,c,n,pad){
  // a brass-framed mithai dabba with a deep velvet lining; cells sit slightly recessed
  const S=c*n, X=x-pad, Y=y-pad, Wd=S+pad*2, R=pad*1.5;
  ctx.save(); ctx.shadowColor="rgba(0,0,0,.6)"; ctx.shadowBlur=pad*3; ctx.shadowOffsetY=pad*.7;
  const gb=ctx.createLinearGradient(0,Y,0,Y+Wd); gb.addColorStop(0,"#f3d08a"); gb.addColorStop(.3,"#d6a14c"); gb.addColorStop(.75,"#a8722c"); gb.addColorStop(1,"#7e4f1d");
  ctx.fillStyle=gb; rr(X,Y,Wd,Wd,R); ctx.fill(); ctx.restore();
  ctx.lineWidth=1; ctx.strokeStyle="rgba(60,30,8,.85)"; rr(X+.5,Y+.5,Wd-1,Wd-1,R); ctx.stroke();
  ctx.strokeStyle="rgba(255,240,200,.55)"; rr(X+1.5,Y+1.5,Wd-3,Wd-3,R-1); ctx.stroke();
  // engraved groove running round the frame
  const gi=pad*.42; ctx.strokeStyle="rgba(90,50,14,.55)"; ctx.lineWidth=Math.max(1,pad*.09); rr(X+gi,Y+gi,Wd-gi*2,Wd-gi*2,R*.7); ctx.stroke();
  ctx.strokeStyle="rgba(255,236,190,.28)"; ctx.lineWidth=1; rr(X+gi+1,Y+gi+1,Wd-gi*2,Wd-gi*2,R*.7); ctx.stroke();
  // brass studs at the corners
  const sr=Math.max(1.6,pad*.2);
  for(const [sx,sy] of [[X+gi,Y+gi],[X+Wd-gi,Y+gi],[X+gi,Y+Wd-gi],[X+Wd-gi,Y+Wd-gi]]){
    const sg=ctx.createRadialGradient(sx-sr*.35,sy-sr*.35,0,sx,sy,sr); sg.addColorStop(0,"#fff4cf"); sg.addColorStop(.5,"#e2b35c"); sg.addColorStop(1,"#7a4a16");
    ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(sx,sy,sr,0,7); ctx.fill(); }
  // velvet lining with a soft inner shadow
  const L=pad*.22; ctx.fillStyle="#22090c"; rr(x-L,y-L,S+L*2,S+L*2,Math.max(4,pad*.6)); ctx.fill();
  for(let j=0;j<n;j++) for(let i=0;i<n;i++){
    const cx=x+i*c+1.5, cy=y+j*c+1.5, cs=c-3;
    const cg=ctx.createLinearGradient(0,cy,0,cy+cs); cg.addColorStop(0,"#2c0d11"); cg.addColorStop(.35,(i+j)%2?"#41151b":"#4a1a1f"); cg.addColorStop(1,(i+j)%2?"#4a1a1f":"#531e23");
    ctx.fillStyle=cg; rr(cx,cy,cs,cs,c*.16); ctx.fill();
    ctx.strokeStyle="rgba(255,190,160,.07)"; ctx.lineWidth=1; rr(cx+.5,cy+.5,cs-1,cs-1,c*.16); ctx.stroke(); }
  ctx.save(); rr(x-L,y-L,S+L*2,S+L*2,Math.max(4,pad*.6)); ctx.clip();
  const sh=Math.max(6,c*.35);
  let ig=ctx.createLinearGradient(0,y-L,0,y-L+sh); ig.addColorStop(0,"rgba(0,0,0,.55)"); ig.addColorStop(1,"rgba(0,0,0,0)"); ctx.fillStyle=ig; ctx.fillRect(x-L,y-L,S+L*2,sh);
  ig=ctx.createLinearGradient(x-L,0,x-L+sh*.6,0); ig.addColorStop(0,"rgba(0,0,0,.4)"); ig.addColorStop(1,"rgba(0,0,0,0)"); ctx.fillStyle=ig; ctx.fillRect(x-L,y-L,sh*.6,S+L*2);
  ig=ctx.createLinearGradient(x+S+L,0,x+S+L-sh*.6,0); ig.addColorStop(0,"rgba(0,0,0,.3)"); ig.addColorStop(1,"rgba(0,0,0,0)"); ctx.fillStyle=ig; ctx.fillRect(x+S+L-sh*.6,y-L,sh*.6,S+L*2);
  ctx.restore();
}
function drawHero(){
  const h=$("hero"); ctx=h.getContext("2d"); ctx.setTransform(2,0,0,2,0,0); ctx.clearRect(0,0,300,300);
  const c=62, x=26, y=22; drawBox(x,y,c,4,12);
  const P=[[0,0,1],[1,0,1],[2,0,5],[3,0,5],[0,1,1],[1,1,2],[3,1,5],[0,2,4],[1,2,2],[2,2,2],[0,3,4],[1,3,4],[2,3,0],[3,3,0]];
  for(const [i,j,f] of P) drawSweet(x+i*c,y+j*c,c,f);
  ctx=ctx0;
}
function drawArt(){
  const bg=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.75); bg.addColorStop(0,"#3a2012"); bg.addColorStop(1,BG); ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  if(ART==="icon"){ const c=W*.37, x=(W-c*2)/2; drawBox(x,x,c,2,W*.055);
    [[0,0,1],[1,0,2],[0,1,4],[1,1,5]].forEach(([i,j,f])=>drawSweet(x+i*c,x+j*c,c,f)); return; }
  const c=H*.15, n=5, x=W-c*n-H*.14, y=(H-c*n)/2; drawBox(x,y,c,n,H*.03);
  const M=["11.55","12255","422.0","44200","3.300"];
  M.forEach((row,j)=>[...row].forEach((ch,i)=>{ if(ch!==".") drawSweet(x+i*c,y+j*c,c,+ch); }));
  ctx.textAlign="left"; ctx.textBaseline="middle"; ctx.fillStyle="#fff"; ctx.font="800 "+H*.17+"px ui-rounded,system-ui";
  ctx.fillText("Mithai",H*.12,H*.33); ctx.fillText("Box",H*.12,H*.51);
  ctx.fillStyle="#ffdf8a"; ctx.font="700 "+H*.058+"px ui-rounded,system-ui"; ctx.fillText("Pack the dabba.",H*.125,H*.68); ctx.fillText("Clear the rows.",H*.125,H*.755);
}

function dragTarget(){
  if(!drag) return null;
  const p=tray[drag.i]; const px=drag.x-p.w*cell/2, py=drag.y-drag.lift-p.h*cell;
  const gx=Math.round((px-ox)/cell), gy=Math.round((py-oy)/cell);
  return { p, px, py, gx, gy, ok:canPlace(p,gx,gy) };
}

function draw(now){
  requestAnimationFrame(draw);
  ctx.setTransform(D,0,0,D,0,0);
  if(ART){ drawArt(); return; }
  if(bgC) ctx.drawImage(bgC,0,0,W,H); else { ctx.fillStyle=BG; ctx.fillRect(0,0,W,H); }
  if(!playing||!grid) return;

  // HUD: white numbers, small-caps muted labels (scaled with hk on big screens, centred in the space above the box)
  shown += (score-shown)*0.2; if(Math.abs(score-shown)<.5) shown=score;
  const F=(w,px)=>w+" "+Math.round(px*hk)+"px ui-rounded,system-ui";
  const rowY=hudRow;
  const scY=Math.max(rowY+30*hk, oy-bpad-30*hk);
  ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillStyle="#b9a693"; ctx.font=F(800,12); ctx.letterSpacing="1px";
  ctx.fillText(mode==="daily" ? "DAILY BOX · "+niceDate(dayKey).toUpperCase() : "ENDLESS", W/2, rowY, W-220*hk);
  ctx.shadowColor="rgba(242,166,74,.35)"; ctx.shadowBlur=24;
  ctx.fillStyle="#fff"; ctx.font=F(900,Math.min(46,W*.115)); ctx.letterSpacing="0px"; ctx.fillText(Math.round(shown), W/2, scY);
  ctx.shadowBlur=0;
  ctx.textAlign="right"; ctx.fillStyle="#b9a693"; ctx.font=F(800,11); ctx.letterSpacing="1px"; ctx.fillText("BEST", W-16, rowY-10*hk);
  ctx.fillStyle="#fff"; ctx.font=F(900,19); ctx.letterSpacing="0px"; ctx.fillText(best, W-16, rowY+9*hk);
  if(streak>1){ ctx.textAlign="right"; ctx.fillStyle="#ffdf8a"; ctx.font=F(900,12); ctx.letterSpacing="1px"; ctx.fillText("STREAK x"+streak, W-16, rowY+30*hk); ctx.letterSpacing="0px"; }

  ctx.save();
  if(shake>0){ ctx.translate(Math.sin(now/18)*4*shake, Math.cos(now/14)*3*shake); shake=Math.max(0,shake-.06); }
  drawBox(ox,oy,cell,N,bpad);

  // preview of lines that would clear
  const T=dragTarget();
  if(T&&T.ok){
    const L=linesIfPlaced(T.p,T.gx,T.gy); ctx.fillStyle="rgba(255,223,138,.26)";
    for(const y of L.rows){ rr(ox,oy+y*cell,cell*N,cell,8); ctx.fill(); }
    for(const x of L.cols){ rr(ox+x*cell,oy,cell,cell*N,8); ctx.fill(); }
  }
  for(let y=0;y<N;y++) for(let x=0;x<N;x++) if(grid[y][x]>=0) drawSweet(ox+x*cell,oy+y*cell,cell,grid[y][x],over?.55:1);
  if(T&&T.ok) drawPiece(T.p,ox+T.gx*cell,oy+T.gy*cell,cell,.42);

  // clearing animation
  fx=fx.filter(e=>now-e.t<300);
  for(const e of fx){ const k=Math.max(0,(now-e.t)/300); if(now<e.t){ drawSweet(ox+e.x*cell,oy+e.y*cell,cell,e.f); continue; }
    const s=cell*(1+k*.35); ctx.save(); ctx.globalAlpha=1-k;
    drawSweet(ox+e.x*cell-(s-cell)/2, oy+e.y*cell-(s-cell)/2, s, e.f);
    ctx.fillStyle="#fff"; ctx.globalAlpha=(1-k)*.6; rr(ox+e.x*cell,oy+e.y*cell,cell,cell,cell*.2); ctx.fill(); ctx.restore(); }
  ctx.restore();

  // tray: espresso glass panel with three separate slots; only pieces that fit nowhere are dimmed
  const tx=Math.max(8,W/2-slotW*1.5), tw=Math.min(W-16,slotW*3);
  ctx.fillStyle="rgba(28,17,11,.88)"; rr(tx,trayY,tw,trayH,24); ctx.fill();
  ctx.strokeStyle="rgba(255,236,210,.12)"; ctx.lineWidth=1; rr(tx+.5,trayY+.5,tw-1,trayH-1,24); ctx.stroke();
  const gp=6;
  for(let i=0;i<3;i++){ const [cx,cy]=slotCenter(i); const p=tray[i];
    const l=Math.max(tx+gp,cx-slotW/2+gp/2), r=Math.min(tx+tw-gp,cx+slotW/2-gp/2);
    const live=p&&!(drag&&drag.i===i), dead=live&&!fitsAnywhere(p);
    ctx.fillStyle=live&&!dead ? "rgba(255,236,210,.07)" : "rgba(255,236,210,.025)"; rr(l,trayY+gp,r-l,trayH-gp*2,18); ctx.fill();
    if(!live) continue;
    drawPiece(p,cx-p.w*mini/2,cy-p.h*mini/2,mini,dead?.28:1); }
  if(T) drawPiece(T.p,T.px,T.py,cell,.96);

  // score pops
  pops=pops.filter(p=>now-p.t<900);
  for(const p of pops){ const k=(now-p.t)/900; ctx.globalAlpha=1-k*k; ctx.textAlign="center";
    ctx.font="800 "+Math.round(cell*.5)+"px ui-rounded,system-ui"; ctx.lineWidth=5; ctx.strokeStyle="rgba(36,19,10,.85)"; ctx.fillStyle="#ffdf8a";
    const X=Math.min(Math.max(ox+p.x*cell,100),W-100), Y=oy+p.y*cell-k*46;
    ctx.strokeText(p.text,X,Y); ctx.fillText(p.text,X,Y); ctx.globalAlpha=1; }

  if(moves===0&&!drag&&!over){ ctx.fillStyle="#d9c7b2"; ctx.font="700 14px ui-rounded,system-ui"; ctx.textAlign="center";
    ctx.fillText("Drag a piece up into the box", W/2, trayY-15, W-24); }
}

// ---------- input ----------
cv.addEventListener("pointerdown",e=>{
  if(over||BOT||!playing||drag) return; const x=e.clientX, y=e.clientY;
  if(y<trayY-10) return;
  let i=Math.round((x-W/2)/slotW)+1; i=Math.max(0,Math.min(2,i));
  if(!tray[i]) return;
  drag={ i, x, y, id:e.pointerId, lift:e.pointerType==="mouse"?10:70 }; try{ cv.setPointerCapture(e.pointerId); }catch(_){}
  snd("pick");
});
cv.addEventListener("pointermove",e=>{ if(drag&&e.pointerId===drag.id){ drag.x=e.clientX; drag.y=e.clientY; } });
cv.addEventListener("pointerup",e=>{ if(!drag||e.pointerId!==drag.id) return; const T=dragTarget(), i=drag.i; drag=null;
  if(T.ok) place(i,T.gx,T.gy); else snd("bad"); });
cv.addEventListener("pointercancel",()=>{ drag=null; });
addEventListener("resize",layout);
$("pdaily").onclick=()=>start("daily"); $("pendless").onclick=()=>start("endless");
$("again").onclick=()=>start(mode,true); $("tohome").onclick=goHome; $("bhome").onclick=goHome;
function sndIcon(){ $("bsnd").style.opacity=muted?.4:1; $("bsnd").innerHTML=muted?"&#10005;":"&#9834;"; }
$("bsnd").onclick=()=>{ muted=!muted; LS.set("mb_mute",muted?"1":"0"); sndIcon(); if(!muted) snd("pick"); };
$("share").onclick=()=>{
  const url="https://heeray1.github.io/mithai-box/";
  const text = mode==="daily" ? "Mithai Box 🍬 Daily Box "+niceDate(dayKey)+": I scored "+score+". Same pieces for everyone, can you beat me?"
                              : "Mithai Box 🍬 I packed "+score+" points of mithai. Can you beat me?";
  if(navigator.share&&location.protocol==="https:") navigator.share({ text, url }).catch(()=>{});
  else window.open("https://wa.me/?text="+encodeURIComponent(text+" "+url),"_blank");
};

// ---------- test hooks: ?bot=ms plays by itself (add &mode=daily), ?art=icon|share draws store art ----------
function botMove(){ if(over||!playing) return;
  const opts=[]; tray.forEach((p,i)=>{ if(!p) return; for(let y=0;y<=N-p.h;y++) for(let x=0;x<=N-p.w;x++) if(canPlace(p,x,y)){
    const L=linesIfPlaced(p,x,y); opts.push({i,x,y,n:L.rows.length+L.cols.length}); } });
  if(!opts.length) return; opts.sort((a,b)=>b.n-a.n);
  const o=opts[0].n ? opts[0] : opts[(Math.random()*opts.length)|0]; place(o.i,o.x,o.y); }
window.__state=()=>({ mode, score, best, over, moves, deal, streak, filled:grid?grid.flat().filter(v=>v>=0).length:0,
  tray:tray?tray.map(p=>p&&p.cells.length+":"+p.f):null });

layout(); sndIcon(); requestAnimationFrame(draw);
if(ART){ $("home").classList.remove("on"); $("top").style.display="none"; }
else if(BOT||Q.has("mode")){ start(Q.get("mode")==="daily"?"daily":"endless", BOT); if(BOT) setInterval(botMove, +(Q.get("bot")||120)); }
else goHome();
</script>
